## Reglas de disciplina entre módulos

Para que el monolito mantenga la disciplina de microservicios:

1. **Un módulo nunca importa el repositorio de otro módulo.**
   Si `IntelligenceModule` necesita datos de `FinanceModule`, importa `FinanceModule`
   y usa su `FinanceService` público, no su repositorio directamente.

2. **Las entidades de otro módulo se referencian solo en relaciones TypeORM,**
   no se instancian ni se modifican desde módulos externos.

3. **Los eventos entre módulos van por BullMQ,** no por llamadas directas de servicio
   cuando la operación es asíncrona (ej: crear notificación al cerrar un periodo).

4. **Cada módulo expone solo lo que necesita** vía `exports: []` en su `*.module.ts`.

5. **El `SharedModule` es la única excepción** — es `@Global()` y expone
   infraestructura, nunca lógica de negocio.