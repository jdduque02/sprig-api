### `src/modules/ai/services/ai.service.ts`
```typescript
import { Injectable } from '@nestjs/common';
import { ConfigService } from '@nestjs/config';

export interface InsightContext {
  userId: string;
  totalIncome: number;
  totalExpense: number;
  expenseRatio: number;
  expenses: Array<{ category_name: string; total: number }>;
  profile: Record<string, number>;
}

@Injectable()
export class AiService {
  constructor(private readonly config: ConfigService) {}

  async generateInsights(ctx: InsightContext): Promise<object[]> {
    const prompt = this.buildPrompt(ctx);

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': this.config.get('ai.apiKey'),
        'anthropic-version': '2023-06-01',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `Eres un asesor financiero personal. Analiza el resumen financiero 
                 y devuelve ÚNICAMENTE un JSON array de insights, sin texto adicional.
                 Formato: [{ type, severity, message, suggested_action }]
                 severity: 'info' | 'warning' | 'critical'`,
        messages: [{ role: 'user', content: prompt }],
      }),
    });

    const data = await response.json();
    try {
      const text = data.content[0].text.replace(/```json|```/g, '').trim();
      return JSON.parse(text);
    } catch {
      return [];
    }
  }

  private buildPrompt(ctx: InsightContext): string {
    const topExpenses = ctx.expenses
      .slice(0, 5)
      .map(e => `- ${e.category_name}: $${(+e.total).toLocaleString('es-CO')}`)
      .join('\n');

    return `
Resumen financiero del mes:
- Ingresos totales: $${ctx.totalIncome.toLocaleString('es-CO')} COP
- Gastos totales: $${ctx.totalExpense.toLocaleString('es-CO')} COP
- Ratio de gasto: ${ctx.expenseRatio.toFixed(1)}%
- Perfil financiero: necesidades ${ctx.profile?.needsRatio}%, deseos ${ctx.profile?.wantsRatio}%, ahorro ${ctx.profile?.savingsRatio}%

Top categorías de gasto:
${topExpenses}

Genera máximo 4 insights accionables en español colombiano.
    `.trim();
  }
}
