### `src/modules/intelligence/services/summary.service.ts`
```typescript
import { Injectable } from '@nestjs/common';
import { InjectDataSource } from '@nestjs/typeorm';
import { DataSource } from 'typeorm';
import { AiService } from '../../ai/services/ai.service';
import { SummaryRepository } from '../repositories/summary.repository';

@Injectable()
export class SummaryService {
  constructor(
    private readonly summaryRepo: SummaryRepository,
    private readonly aiService: AiService,
    @InjectDataSource() private readonly dataSource: DataSource,
  ) {}

  async calculateForPeriod(userId: string, year: number, month: number) {
    // 1. Obtener datos del periodo con aggregate query
    const [income, expenses] = await Promise.all([
      this.getIncomeByCategory(userId, year, month),
      this.getExpenseByCategory(userId, year, month),
    ]);

    // 2. Obtener perfil del usuario para calcular ratios
    const profile = await this.dataSource.query(
      `SELECT * FROM identity.financial_profile WHERE user_id = $1`, [userId]
    );

    // 3. Calcular métricas
    const totalIncome  = income.reduce((s, r) => s + +r.total, 0);
    const totalExpense = expenses.reduce((s, r) => s + +r.total, 0);
    const expenseRatio = totalIncome > 0 ? (totalExpense / totalIncome) * 100 : 0;

    // 4. Generar insights con IA
    const insights = await this.aiService.generateInsights({
      userId, totalIncome, totalExpense, expenseRatio,
      expenses, profile: profile[0],
    });

    // 5. Upsert del resumen
    return this.summaryRepo.upsert({
      userId, totalIncome, totalExpense, expenseRatio,
      isOverSpending: expenseRatio > (profile[0]?.needsRatio + profile[0]?.wantsRatio),
      insights,
    }, ['userId', 'financialPeriodId']);
  }

  private async getExpenseByCategory(userId: string, year: number, month: number) {
    // Partition pruning: filtrar por created_at con rango exacto del mes
    return this.dataSource.query(`
      SELECT
        c.id   AS category_id,
        c.name AS category_name,
        SUM(t.amount) AS total,
        COUNT(*)      AS tx_count
      FROM finance.transaction_record t
      JOIN catalog.category c ON c.id = t.category_id
      WHERE t.user_id    = $1
        AND t.type       = 'expense'
        AND t.deleted_at IS NULL
        AND t.created_at >= make_date($2, $3, 1)
        AND t.created_at <  make_date($2, $3, 1) + interval '1 month'
      GROUP BY c.id, c.name
      ORDER BY total DESC
    `, [userId, year, month]);
  }

  private async getIncomeByCategory(userId: string, year: number, month: number) {
    return this.dataSource.query(`
      SELECT SUM(amount) AS total
      FROM finance.transaction_record
      WHERE user_id    = $1
        AND type       = 'income'
        AND deleted_at IS NULL
        AND created_at >= make_date($2, $3, 1)
        AND created_at <  make_date($2, $3, 1) + interval '1 month'
    `, [userId, year, month]);
  }
}
```

