### `src/modules/finance/dto/create-transaction.dto.ts`
```typescript
import { IsEnum, IsPositive, IsOptional, IsString, IsDateString, IsArray, IsUrl } from 'class-validator';
import { ApiProperty, ApiPropertyOptional } from '@nestjs/swagger';
import { TransactionType, PaymentMethod } from '../entities/transaction-record.entity';

export class CreateTransactionDto {
  @ApiProperty({ enum: TransactionType })
  @IsEnum(TransactionType)
  type: TransactionType;

  @ApiProperty({ example: 150000 })
  @IsPositive()
  amount: number;

  @ApiPropertyOptional({ enum: PaymentMethod })
  @IsEnum(PaymentMethod)
  @IsOptional()
  paymentMethod?: PaymentMethod;

  @ApiPropertyOptional()
  @IsString()
  @IsOptional()
  description?: string;

  @ApiPropertyOptional()
  @IsString()
  @IsOptional()
  categoryId?: string;

  @ApiPropertyOptional()
  @IsString()
  @IsOptional()
  subcategoryId?: string;

  @ApiPropertyOptional({ description: 'ISO 8601 — si no se envía se usa la fecha actual' })
  @IsDateString()
  @IsOptional()
  date?: Date;

  @ApiPropertyOptional({ type: [String], description: 'URLs de comprobantes' })
