### `src/modules/finance/controllers/transaction.controller.ts`
```typescript
import { Controller, Get, Post, Delete, Body, Param, Query, UseGuards, Version } from '@nestjs/common';
import { ApiTags, ApiOperation, ApiBearerAuth, ApiResponse } from '@nestjs/swagger';
import { TransactionService } from '../services/transaction.service';
import { CreateTransactionDto } from '../dto/create-transaction.dto';
import { FilterTransactionDto } from '../dto/filter-transaction.dto';
import { JwtAuthGuard } from '../../../shared/guards/jwt-auth.guard';
import { CurrentUser } from '../../../shared/decorators/current-user.decorator';

@ApiTags('Finance — Transactions')  // ← agrupa en Swagger bajo el dominio
@ApiBearerAuth()
@UseGuards(JwtAuthGuard)
@Controller('transactions')
export class TransactionController {
  constructor(private readonly txService: TransactionService) {}

  @Post()
  @ApiOperation({ summary: 'Registrar una nueva transacción' })
  @ApiResponse({ status: 201, description: 'Transacción creada' })
  create(@CurrentUser() user: { id: string }, @Body() dto: CreateTransactionDto) {
    return this.txService.create(user.id, dto);
  }

  @Get()
  @ApiOperation({ summary: 'Listar transacciones del usuario con filtros' })
  findAll(@CurrentUser() user: { id: string }, @Query() filters: FilterTransactionDto) {
    return this.txService.findByUser(user.id, filters);
  }

  @Delete(':id')
  @ApiOperation({ summary: 'Eliminar (soft delete) una transacción' })
  remove(@CurrentUser() user: { id: string }, @Param('id') id: string) {
    return this.txService.softDelete(id, user.id);
  }
}
