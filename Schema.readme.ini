### `src/modules/finance/services/transaction.service.ts`
```typescript
import { Injectable, NotFoundException } from '@nestjs/common';
import { InjectRepository } from '@nestjs/typeorm';
import { DataSource, Between, IsNull } from 'typeorm';
import { TransactionRepository } from '../repositories/transaction.repository';
import { CreateTransactionDto } from '../dto/create-transaction.dto';
import { FilterTransactionDto } from '../dto/filter-transaction.dto';
import { AuditService } from '../../../shared/audit/audit.service';
import { AppUser } from '../../identity/entities/user.entity';

@Injectable()
export class TransactionService {
  constructor(
    private readonly txRepo: TransactionRepository,
    private readonly auditService: AuditService,
    private readonly dataSource: DataSource,
  ) {}

  async create(userId: string, dto: CreateTransactionDto) {
    // Insert directo con QueryBuilder para respetar la partición por created_at
    const result = await this.dataSource
      .createQueryBuilder()
      .insert()
      .into('finance.transaction_record')
      .values({ ...dto, userId, createdAt: dto.date ?? new Date() })
      .returning('*')
      .execute();

    await this.auditService.log({
      schema: 'finance', table: 'transaction_record',
      recordId: result.raw[0].id, action: 'INSERT',
      newData: result.raw[0], changedBy: userId,
    });

    return result.raw[0];
  }

  async findByUser(userId: string, filters: FilterTransactionDto) {
    // SIEMPRE incluir created_at en el WHERE para activar partition pruning
    return this.txRepo.find({
      where: {
        userId,
        createdAt: Between(filters.from, filters.to), // ← partition pruning
        deletedAt: IsNull(),
        ...(filters.type && { type: filters.type }),
        ...(filters.categoryId && { categoryId: filters.categoryId }),
      },
      order: { createdAt: 'DESC' },
      take: filters.limit ?? 20,
      skip: filters.offset ?? 0,
    });
  }

  async softDelete(id: string, userId: string) {
    const tx = await this.txRepo.findOne({ where: { id, userId, deletedAt: IsNull() } });
    if (!tx) throw new NotFoundException('Transaction not found');

    await this.txRepo.softDelete(id);
    await this.auditService.log({
      schema: 'finance', table: 'transaction_record',
      recordId: id, action: 'DELETE',
      oldData: tx, changedBy: userId,
    });
  }
}
```

