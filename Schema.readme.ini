### `src/modules/notification/workers/notification.worker.ts`
```typescript
import { Processor, WorkerHost } from '@nestjs/bullmq';
import { Job } from 'bullmq';
import { NotificationService } from '../services/notification.service';

export const NOTIFICATION_QUEUE = 'notifications';

export interface NotificationJob {
  userId: string;
  title: string;
  description: string;
  type: 'objective_due' | 'over_budget' | 'period_close';
}

@Processor(NOTIFICATION_QUEUE)
export class NotificationWorker extends WorkerHost {
  constructor(private readonly notifService: NotificationService) {
    super();
  }

  async process(job: Job<NotificationJob>) {
    switch (job.data.type) {
      case 'objective_due':
        return this.notifService.createAlert(job.data);
      case 'over_budget':
        return this.notifService.createBudgetAlert(job.data);
      case 'period_close':
        return this.notifService.createPeriodSummary(job.data);
    }
  }
}
