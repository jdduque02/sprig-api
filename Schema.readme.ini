### `src/modules/finance/entities/transaction-record.entity.ts`
```typescript
import { Entity, Column, ManyToOne, JoinColumn, Index } from 'typeorm';
import { BaseEntity } from '../../../shared/database/base.entity';
import { AppUser } from '../../identity/entities/user.entity';
import { Category } from '../../catalog/entities/category.entity';
import { Subcategory } from '../../catalog/entities/subcategory.entity';

export enum TransactionType {
  INCOME  = 'income',
  EXPENSE = 'expense',
}

export enum PaymentMethod {
  BANK_TRANSFER  = 'bank_transfer',
  CASH           = 'cash',
  DEBIT_CARD     = 'debit_card',
  CREDIT_CARD    = 'credit_card',
  DIGITAL_WALLET = 'digital_wallet',
  MOBILE_PAYMENT = 'mobile_payment',
  CHECK          = 'check',
  CRYPTO         = 'crypto',
}

// La tabla está particionada — PK compuesta (id, created_at)
// TypeORM no soporta PKs compuestas en partitioned tables nativamente,
// se usa query builder o raw queries para inserts.
@Entity({ schema: 'finance', name: 'transaction_record' })
@Index(['userId', 'createdAt'])
@Index(['userId', 'type', 'createdAt'])
export class TransactionRecord extends BaseEntity {
  @Column({ name: 'user_id', type: 'bigint' })
  userId: string;

  @Column({ name: 'category_id', type: 'bigint', nullable: true })
  categoryId: string;

  @Column({ name: 'subcategory_id', type: 'bigint', nullable: true })
  subcategoryId: string;

  @Column({ type: 'enum', enum: TransactionType })
  type: TransactionType;

  @Column({ type: 'numeric', precision: 15, scale: 2 })
  amount: number;

  @Column({ name: 'payment_method', type: 'enum', enum: PaymentMethod, nullable: true })
  paymentMethod: PaymentMethod;

  @Column({ nullable: true })
  description: string;

  @Column({ name: 'reference_code', nullable: true })
  referenceCode: string;

  @Column({ type: 'text', array: true, default: '{}' })
  attachments: string[];

  @Column({ name: 'source_bank', nullable: true })
  sourceBank: string;

  @Column({ name: 'destination_bank', nullable: true })
  destinationBank: string;

  @Column({ nullable: true })
  addressee: string;

  // Relaciones (sin cascade para no violar la partición)
  @ManyToOne(() => AppUser)
  @JoinColumn({ name: 'user_id' })
  user: AppUser;

  @ManyToOne(() => Category)
  @JoinColumn({ name: 'category_id' })
  category: Category;

  @ManyToOne(() => Subcategory)
  @JoinColumn({ name: 'subcategory_id' })
  subcategory: Subcategory;
}
```

