name: sprig-stage

services:
  postgres:
    image: postgres:16-alpine
    container_name: sprig_stage_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-cost_manager}
      POSTGRES_USER: ${DB_USER:?DB_USER no definido}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definido}
    volumes:
      - postgres_stage_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sprig_stage_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD no definido}"]
    volumes:
      - redis_stage_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sprig_stage_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER no definido}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD no definido}
    volumes:
      - rabbitmq_stage_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    container_name: sprig_stage_keycloak
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-cost_manager}
      KC_DB_USERNAME: ${DB_USER:?DB_USER no definido}
      KC_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definido}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN no definido}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD no definido}
    command: start-dev
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-8080}:8080"
    restart: unless-stopped

  # Job de una sola corrida: aplica schema.sql + migrations/*.sql pendientes
  # (ver scripts/apply-schema.sh — el `migration:run` de TypeORM no sirve
  # aquí porque las migraciones reales del repo son SQL plano, no .ts/.js).
  migrator:
    image: postgres:16-alpine
    container_name: sprig_stage_migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${DB_USER:?DB_USER no definido}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definido}
      PGDATABASE: ${DB_NAME:-cost_manager}
    volumes:
      - ./schema.sql:/work/schema.sql:ro
      - ./migrations:/work/migrations:ro
      - ./scripts/apply-schema.sh:/work/apply-schema.sh:ro
    entrypoint: ["sh", "/work/apply-schema.sh"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: deploy
    container_name: sprig_stage_backend
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    env_file:
      - .env.stage
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      KEYCLOAK_URL: http://keycloak:8080
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v${VERSION:-1}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ../Sprig-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: sprig_stage_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HTTP_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  postgres_stage_data:
  redis_stage_data:
  rabbitmq_stage_data:
